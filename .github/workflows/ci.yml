name: Build and validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke-test API
        run: |
          npm run server &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..10}; do
            curl --fail http://localhost:3000/api/health && break
            sleep 1
          done
          curl --fail http://localhost:3000/api/menu

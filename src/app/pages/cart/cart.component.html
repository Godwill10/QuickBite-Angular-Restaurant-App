<h2 class="cart-title">Your Cart</h2>
<div class="cart-container">
  <div *ngIf="cartService.cart.length === 0" class="empty-cart"><p>Your cart is empty.</p><a routerLink="/menu" class="btn-gold">Back to Menu</a></div>
  <div *ngFor="let item of cartService.cart" class="cart-item">
    <div class="details"><h3>{{ item.name }}</h3><p>Quantity: {{ item.quantity }}</p><p class="price">${{ item.price }} each</p></div>
    <button (click)="remove(item.id)" class="remove-btn">Remove</button>
  </div>
  <div *ngIf="cartService.cart.length > 0" class="totals"><p>Total</p><h2 class="gold">${{ getTotal().toFixed(2) }}</h2><a routerLink="/checkout" class="btn-checkout">Checkout</a></div>
</div>

<div *ngIf="item" class="details"><div class="photo" [style.backgroundImage]="'url(' + item.image + ')'"> </div><div class="copy"><p class="eyebrow">QUICKBITE MENU</p><h2>{{ item.name }}</h2><p>{{ item.description }}</p><p class="price">${{ item.price }}</p><button (click)="addToCart()">Add to Cart</button><a routerLink="/menu">Back to Menu</a></div></div>

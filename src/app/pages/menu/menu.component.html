<h2 class="title">Our Menu</h2>
<div class="menu-list">
  <div class="menu-item" *ngFor="let item of items">
    <div class="img" [style.backgroundImage]="'url(' + item.image + ')'"> </div>
    <h3>{{ item.name }}</h3>
    <p>{{ item.description }}</p>
    <p class="price">${{ item.price }}</p>
    <div class="qty-row">
      <label>Qty:</label>
      <input type="number" min="1" max="10" [(ngModel)]="quantities[item.id]">
      <button (click)="addToCart(item)">Add to Cart</button>
    </div>
    <a [routerLink]="['/details', item.id]">Details</a>
  </div>
</div>
